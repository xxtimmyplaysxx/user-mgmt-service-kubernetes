spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}

# Kubernetes probes use these dedicated health groups.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=user-mgmt-service
management.metrics.distribution.percentiles-histogram.http.server.requests=true
module-service.base-url=${MODULE_SERVICE_BASE_URL:http://user-mgmt-module:8080}
module-service.connect-timeout-ms=${MODULE_SERVICE_CONNECT_TIMEOUT_MS:1000}
module-service.request-timeout-ms=${MODULE_SERVICE_REQUEST_TIMEOUT_MS:2000}
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
